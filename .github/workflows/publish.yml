name: Publish container images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tezaurs-suggestion-review-backend:${{ github.event.workflow_run.head_sha }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tezaurs-suggestion-review-frontend:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}
            ghcr.io/${{ github.repository_owner }}/tezaurs-suggestion-review-backend:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/tezaurs-suggestion-review-frontend:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
