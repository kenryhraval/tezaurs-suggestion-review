spring:
  application:
    name: tezaurs-suggestion-review
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tezaurs_suggestions}
    username: ${DATABASE_USERNAME:tezaurs}
    password: ${DATABASE_PASSWORD}
  flyway:
    default-schema: review
    schemas: review
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: review

management:
  endpoints:
    web:
      exposure:
        include: health
