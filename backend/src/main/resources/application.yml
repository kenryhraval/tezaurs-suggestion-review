spring:
  application:
    name: tezaurs-tip
  flyway:
    default-schema: review
    schemas: review
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: review

suggestions:
  import-delay-ms: ${SUGGESTIONS_IMPORT_DELAY_MS:10000}

model:
  default-model: gemini-flash-lite
  models:
    gemini-flash-lite:
      label: Gemini Flash-Lite
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-3.5-flash-lite
      api-key: ${GEMINI_API_KEY:}
    groq-gpt-oss:
      label: GPT-OSS 120B (Groq)
      base-url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      api-key: ${GROQ_API_KEY:}
  max-selected-examples: ${MODEL_MAX_SELECTED_EXAMPLES:200}
  max-input-characters: ${MODEL_MAX_INPUT_CHARACTERS:250000}
  prompts:
    clustering: ${SENSE_CLUSTERING_PROMPT:classpath:prompts/cluster-senses.txt}
    definitions: ${SENSE_DEFINITION_PROMPT:classpath:prompts/define-senses.txt}

management:
  endpoints:
    web:
      exposure:
        include: health
