name: tezaurs-tip-production

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/kenryhraval/tezaurs-suggestion-review-backend:latest}
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      GEMINI_API_KEY:
      GROQ_API_KEY:
      MODEL_MAX_SELECTED_EXAMPLES:
      MODEL_MAX_INPUT_CHARACTERS:
      SUGGESTIONS_IMPORT_DELAY_MS:
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: local

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/kenryhraval/tezaurs-suggestion-review-frontend:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: local
