name: tezaurs-suggestion-review

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/kenryhraval/tezaurs-suggestion-review-backend:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tezaurs_suggestions
      DATABASE_USERNAME: tezaurs
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: local

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/kenryhraval/tezaurs-suggestion-review-frontend:latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: local

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: tezaurs_suggestions
      POSTGRES_USER: tezaurs
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ${TEZAURS_DICT_DUMP:-./import/tezaurs_2026_03-public.pgsql.gz}
        target: /docker-entrypoint-initdb.d/10-dict.sql.gz
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TEZAURS_SUGGESTIONS_DUMP:-./import/suggestions-2026-09-04.pgsql.gz}
        target: /docker-entrypoint-initdb.d/30-suggestions.sql.gz
        read_only: true
        bind:
          create_host_path: false
    configs:
      - source: create-incubator-schema
        target: /docker-entrypoint-initdb.d/20-create-incubator.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tezaurs -d tezaurs_suggestions"]
      start_period: 30m
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: local

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      BASIC_AUTH_USER_1: ${BASIC_AUTH_USER_1:?Set BASIC_AUTH_USER_1 in .env}
      BASIC_AUTH_PASSWORD_HASH_1: ${BASIC_AUTH_PASSWORD_HASH_1:?Set BASIC_AUTH_PASSWORD_HASH_1 in .env}
      BASIC_AUTH_USER_2: ${BASIC_AUTH_USER_2:?Set BASIC_AUTH_USER_2 in .env}
      BASIC_AUTH_PASSWORD_HASH_2: ${BASIC_AUTH_PASSWORD_HASH_2:?Set BASIC_AUTH_PASSWORD_HASH_2 in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging:
      driver: local

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

configs:
  create-incubator-schema:
    content: |
      CREATE SCHEMA IF NOT EXISTS incubator;
